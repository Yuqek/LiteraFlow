name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install test and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "flet[all]==0.28.3" ruff

      - name: Verify source
        run: |
          python -m py_compile main.py test_literaflow_core.py
          ruff check main.py test_literaflow_core.py
          python -m unittest -v test_literaflow_core.py

      - name: Build APK
        run: >-
          flet build apk . --verbose
          --project literaflow
          --product LiteraFlow
          --org app.literaflow
          --build-version 0.8.0
          --build-number "${{ github.run_number }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LiteraFlow-Android-${{ github.run_number }}
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 30
